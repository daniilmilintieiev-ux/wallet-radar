name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + test + selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: offline selftest
        run: node dist/src/cli.js selftest
